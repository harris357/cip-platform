apiVersion: v1
kind: ConfigMap
metadata:
  name: clamav-clamd-conf
  namespace: cip-infra
data:
  clamd.conf: |
    # Slice 58A — clamd config rendered from values.yaml.
    # Demo-mode trims (DetectPUA + Bytecode disabled) save ~300MB
    # resident vs full-mode defaults; see values.yaml header for
    # rationale and production-override helm flags.

    TCPSocket 3310
    TCPAddr 0.0.0.0
    MaxFileSize {{ .Values.clamd.maxFileSize }}
    MaxScanSize {{ .Values.clamd.maxScanSize }}
    MaxRecursion {{ .Values.clamd.maxRecursion }}
    MaxFiles {{ .Values.clamd.maxFiles }}
    StreamMaxLength {{ .Values.clamd.streamMaxLength }}
    ConcurrentDatabaseReload {{ .Values.clamd.concurrentDatabaseReload }}
    LogTime yes
    LogClean no
    Foreground yes

    # Demo-mode memory trims (~300MB saved):
    DetectPUA {{ if .Values.clamd.detectPUA }}yes{{ else }}no{{ end }}
    Bytecode  {{ if .Values.clamd.bytecodeSignatures }}yes{{ else }}no{{ end }}
