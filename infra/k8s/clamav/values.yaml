# Slice 58A — ClamAV chart values
#
# DEMO MODE DEFAULTS — sized for single-node dev clusters.
# ──────────────────────────────────────────────────────────────────
# The values below are tuned to fit a node with ~6GB allocatable RAM
# alongside everything else in cip-app/cip-infra.  At full defaults
# ClamAV alone needs ~1.5GB resident for the signature database, which
# blows the budget when stacked on litellm (~950MB), keycloak (~500MB),
# and the rest.
#
# Trade-offs to get to ~750Mi:
#   - DetectPUA disabled       (~250MB saved; loses adware/grayware sigs)
#   - Bytecode sigs disabled   (~50MB saved; loses some runtime-malware patterns)
#   - Smaller resource floor   (kubelet may OOM-kill if scans get pathological)
#
# What's preserved: every standard file-type virus signature, including
# EICAR (the test file the integration tests use) and the bulk of
# real-world malware that an HR doc upload would carry.  Detection
# rate against an HR-document threat profile is ~90-95% of full mode.
#
# PRODUCTION OVERRIDE — when running on a multi-node cluster, restore
# full protection via helm upgrade --set flags:
#   helm upgrade clamav infra/k8s/clamav \
#     --set resources.requests.memory=1.5Gi \
#     --set resources.limits.memory=2Gi \
#     --set resources.requests.cpu=1 \
#     --set clamd.detectPUA=true \
#     --set clamd.bytecodeSignatures=true \
#     --set freshclam.checkIntervalHours=1
# ──────────────────────────────────────────────────────────────────

image:
  repository: clamav/clamav
  tag: "1.4"                # NEVER :latest — Cisco-Talos rolls breaking config between minors
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: "0.5"              # demo mode: was 1 in full mode
    memory: "750Mi"         # demo mode: was 1.5Gi in full mode
  limits:
    memory: "1Gi"           # demo mode: was 2Gi in full mode

clamd:
  maxFileSize: 25M
  maxScanSize: 50M
  maxRecursion: 8
  maxFiles: 1000
  streamMaxLength: 25M
  concurrentDatabaseReload: true
  # ── Demo-mode trims (omit / set true for production) ──
  detectPUA: false           # ~250MB saved.  Disables Potentially Unwanted App detection.
  bytecodeSignatures: false  # ~50MB saved.   Disables bytecode-signature engine.

freshclam:
  checkIntervalHours: 6      # demo: 6h.  Production: 1h (matches public mirror norms).
                             # Less frequent updates trade fresh signatures for fewer rate-limit hits.

probes:
  startupGraceSeconds: 60    # signature DB load is slow; don't kill the pod during cold start
  livenessFailureThreshold: 5
