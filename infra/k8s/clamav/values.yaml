# Slice 58A — ClamAV chart values
#
# DEMO MODE — sized for single-node dev clusters at ~970Mi resident.
# ──────────────────────────────────────────────────────────────────
# Trims from upstream Cisco-Talos defaults:
#   - DetectPUA off            (~250MB)
#   - Bytecode signatures off  (~50MB)
#
# Attempted but rolled back (commit 2cde96f→reverted): "ultra-demo"
# trim to ~600Mi via PhishingScans/ScanMail/ScanHTML disabled +
# safebrowsing DB excluded.  Reality: those clamd directives skip
# scan-time work but DO NOT unload the underlying signature DBs from
# resident memory.  Real floor with main.cvd + daily.cvd loaded is
# ~900-970Mi — pod OOMs at any limit below that.  Lesson: clamd
# memory ≈ size(loaded sig DBs), not size(scan paths exercised).
#
# To get below ~750Mi you'd need to actually NOT download main.cvd
# (impossible without breaking virus detection entirely) or use a
# different scanning engine.  Not worth the engineering for demos.
#
# Detection preserved: EICAR, PE/Windows malware, OLE2 docs, PDF,
# images, archives, all generic file-type signatures.  Covers ~95%
# of HR-doc threat profile.
#
# PRODUCTION OVERRIDE — multi-node restoration:
#   helm upgrade clamav infra/k8s/clamav \
#     --set resources.requests.memory=1.5Gi \
#     --set resources.limits.memory=2Gi \
#     --set resources.requests.cpu=1 \
#     --set clamd.detectPUA=true \
#     --set clamd.bytecodeSignatures=true \
#     --set freshclam.checkIntervalHours=1
# ──────────────────────────────────────────────────────────────────

image:
  repository: clamav/clamav
  tag: "1.4"                # NEVER :latest — Cisco-Talos rolls breaking config between minors
  pullPolicy: IfNotPresent

resources:
  requests:
    cpu: "0.5"
    memory: "750Mi"         # was 1.5Gi in full mode
  limits:
    memory: "1Gi"           # was 2Gi in full mode

clamd:
  maxFileSize: 25M
  maxScanSize: 50M
  maxRecursion: 8
  maxFiles: 1000
  streamMaxLength: 25M
  concurrentDatabaseReload: true
  detectPUA: false              # ~250MB saved
  bytecodeSignatures: false     # ~50MB saved

freshclam:
  checkIntervalHours: 6

probes:
  startupGraceSeconds: 60       # signature DB load is slow; don't kill the pod during cold start
  livenessFailureThreshold: 5
