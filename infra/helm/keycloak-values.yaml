# Chart: codecentric/keycloakx
# Image: quay.io/keycloak/keycloak (official, always public)
# helm repo add codecentric https://codecentric.github.io/helm-charts
# helm upgrade --install keycloak codecentric/keycloakx -n cip-auth -f infra/helm/keycloak-values.yaml

args:
  - start

extraEnv: |
  - name: KC_DB
    value: postgres
  - name: KC_DB_URL_HOST
    value: postgres-postgresql.cip-infra
  - name: KC_DB_URL_PORT
    value: "5432"
  - name: KC_DB_URL_DATABASE
    value: keycloak
  - name: KC_DB_USERNAME
    value: cipuser
  - name: KC_DB_PASSWORD
    valueFrom:
      secretKeyRef:
        name: keycloak-db-credentials
        key: password
  - name: KC_PROXY
    value: edge
  - name: KC_HOSTNAME
    value: keycloak.${domain}
  - name: KC_HOSTNAME_STRICT
    value: "false"
  - name: KC_HTTP_RELATIVE_PATH
    value: /auth
  - name: KC_HEALTH_ENABLED
    value: "true"
  - name: KEYCLOAK_ADMIN
    value: admin
  - name: KEYCLOAK_ADMIN_PASSWORD
    valueFrom:
      secretKeyRef:
        name: keycloak-credentials
        key: admin-password

ingress:
  enabled: true
  ingressClassName: nginx
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
  rules:
    - host: keycloak.${domain}
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - keycloak.${domain}
      secretName: keycloak-tls

resources:
  requests:
    memory: 512Mi
    cpu: 100m
  limits:
    memory: 1Gi

livenessProbe: |
  httpGet:
    path: /auth/health/live
    port: 9000
  initialDelaySeconds: 90
  periodSeconds: 30
  failureThreshold: 5

readinessProbe: |
  httpGet:
    path: /auth/health/ready
    port: 9000
  initialDelaySeconds: 90
  periodSeconds: 10
  failureThreshold: 5
