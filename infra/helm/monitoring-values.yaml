# Chart: prometheus-community/kube-prometheus-stack
# helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
# helm upgrade --install monitoring prometheus-community/kube-prometheus-stack -n cip-observe -f infra/helm/monitoring-values.yaml
grafana:
  persistence:
    enabled: false
  sidecar:
    dashboards:
      enabled: true
  resources:
    requests:
      memory: 128Mi
      cpu: 50m
prometheus:
  prometheusSpec:
    retention: 6h
    storageSpec: {}
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        memory: 64Mi
        cpu: 25m
