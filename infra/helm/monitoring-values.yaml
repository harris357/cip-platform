# Chart: prometheus-community/kube-prometheus-stack
# helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
# helm upgrade --install monitoring prometheus-community/kube-prometheus-stack -n cip-observe -f infra/helm/monitoring-values.yaml
#
# Dev: no persistent storage — metrics and dashboards reset on node restart.
# Dashboards should be defined as ConfigMaps (grafana.sidecar.dashboards.enabled).
grafana:
  persistence:
    enabled: false
  sidecar:
    dashboards:
      enabled: true
prometheus:
  prometheusSpec:
    retention: 6h                            # only keep 6h of metrics in dev
    storageSpec: {}                          # emptyDir — no PVC
