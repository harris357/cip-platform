replicaCount: 1

image:
  repository: ghcr.io/harris357/hr-service
  tag: "latest"  # override per-deploy via helm --set image.tag=<sha>
  pullPolicy: Always

service:
  type: ClusterIP
  port: 3000

env:
  LITELLM_BASE_URL: http://litellm.cip-app.svc.cluster.local:4000
  NATS_URL: nats://nats.cip-infra.svc.cluster.local:4222
  TEMPORAL_TASK_QUEUE: cip-hr-tasks
  KEYCLOAK_URL: http://keycloak-keycloakx.cip-auth.svc.cluster.local
  # Dev: single shared realm. Prod: realm per tenant = tenantId (set at deploy time).
  KEYCLOAK_REALM: cip-dev
  TEAMS_BOT_URL: http://teams-bot.cip-app.svc.cluster.local:3978
  KEYCLOAK_CLIENT_ID: hr-service
  MCP_PORT: 4001
  OBJECT_STORE_BUCKET: cip-uploads
  AWS_ENDPOINT_URL: https://s3.bhs.io.cloud.ovh.net
  AWS_REGION: BHS

# Secrets injected via K8s secret reference
envFrom:
  - secretRef:
      name: hr-service-credentials
