replicaCount: 1

image:
  repository: ghcr.io/idlevice/hr-service
  tag: dev
  pullPolicy: Always

service:
  type: ClusterIP
  port: 3000

env:
  LITELLM_BASE_URL: http://litellm.cip-app.svc.cluster.local:4000
  NATS_URL: nats://nats.cip-infra.svc.cluster.local:4222
  TEMPORAL_TASK_QUEUE: cip-hr-tasks
  KEYCLOAK_URL: https://keycloak.dev.cip.io
  KEYCLOAK_REALM: cip-dev
  TEAMS_BOT_URL: http://teams-bot.cip-app.svc.cluster.local:3978
  MCP_PORT: 4001
  OBJECT_STORE_BUCKET: cip-uploads
  AWS_ENDPOINT_URL: https://s3.bhs.io.cloud.ovh.net
  AWS_REGION: BHS

# Secrets injected via K8s secret reference
envFrom:
  - secretRef:
      name: hr-service-credentials
