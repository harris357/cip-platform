apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  namespace: cip-app
  labels:
    app: hr-service
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: hr-service
  template:
    metadata:
      labels:
        app: hr-service
    spec:
      # Slice 56B+ migration auto-run.
      # Init container runs the migrate.js script with the same
      # secret mounts as the main container. Failure here aborts the
      # rollout (Helm --atomic rolls back). The runner is idempotent
      # via schema_migrations bookkeeping, so re-running across
      # rollouts is safe and a no-op when nothing's new.
      initContainers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "dist/db/migrate.js"]
          envFrom:
            {{- toYaml .Values.envFrom | nindent 12 }}
      containers:
        - name: hr-service
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          env:
            {{- range $key, $val := .Values.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
