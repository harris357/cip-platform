apiVersion: batch/v1
kind: CronJob
metadata:
  name: trace-import
  namespace: cip-app
  labels:
    app: hr-service
    component: trace-import
spec:
  # Saturday 02:00 UTC — leads the Sunday 02:30 trainer cron by 24h so
  # admin has time to review imported rows before retraining picks them up.
  # Slice 57C: was previously in the intent-classifier helm chart, running
  # python -m training.import_traces directly. Now triggers
  # RetrainModelWorkflow in 'import-only' mode — same activity logic
  # under one workflow class, K8s CronJob remains the schedule source.
  schedule: "0 2 * * 6"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: 600
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: trace-import
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["node", "dist/modules/classifier-lifecycle/scripts/start-trace-import.js"]
              envFrom:
                # DATABASE_URL_HR (used inside importTracesActivity) +
                # LANGFUSE_* (used by import_traces.py via the
                # /admin/run-trace-import endpoint) + TEMPORAL_*.
                - secretRef:
                    name: hr-service-credentials
              env:
                # The hr-service workflow worker calls the
                # intent-classifier service over HTTP for the actual
                # Python script execution (Slice 56N pattern).
                - name: INTENT_CLASSIFIER_URL
                  value: "http://intent-classifier.cip-app.svc.cluster.local:8000"
