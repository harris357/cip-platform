apiVersion: batch/v1
kind: CronJob
metadata:
  name: checkpoint-gc
  namespace: cip-app
  labels:
    app: hr-service
    component: gc
spec:
  schedule: "30 3 * * *"               # 03:30 UTC nightly (low traffic)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: gc
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["node", "dist/scripts/gc.js"]
              env:
                # Knobs (defaults match the slice doc).
                - name: GC_KEEP_PER_THREAD
                  value: "10"
                - name: GC_KEEP_RECENT_HOURS
                  value: "24"
                - name: GC_METRICS_RETENTION_DAYS
                  value: "90"
              envFrom:
                - secretRef:
                    name: hr-service-credentials
