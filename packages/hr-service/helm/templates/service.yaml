apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}
  namespace: cip-app
spec:
  type: {{ .Values.service.type }}
  selector:
    app: hr-service
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.port }}
    - name: mcp
      protocol: TCP
      port: 4001
      targetPort: 4001
