# Slice 56 + 56B: intent-classifier values.

replicaCount: 2          # stateless; HA + load-spreading

image:
  repository: ghcr.io/harris357/intent-classifier
  tag: "latest"          # override per-deploy via helm --set image.tag=<sha>
  pullPolicy: Always

service:
  type: ClusterIP
  port: 8000

resources:
  requests:
    cpu:    100m
    memory: 128Mi
  limits:
    cpu:    250m          # sklearn predict_proba is microseconds; load is light
    # Slice 56D: bumped from 256Mi to 512Mi — per-tenant cache holds one
    # ~5MB pipeline per active tenant. 50 tenants ≈ 250MB plus baseline.
    # Revisit at 100+ tenants (LRU eviction).
    memory: 512Mi

# Slice 56B: S3 hot-reload config.
#   - MODEL_S3_BUCKET / MODEL_S3_PREFIX    — where the trainer uploads
#   - MODEL_POLL_INTERVAL_SEC              — how often each replica polls
#   - AWS_ENDPOINT_URL / AWS_REGION        — OVH S3 endpoint
# AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY come from the secret below.
env:
  MODEL_S3_BUCKET:        cip-platform-models
  MODEL_S3_PREFIX:        intent-classifier
  MODEL_POLL_INTERVAL_SEC: "60"
  AWS_ENDPOINT_URL:       https://s3.bhs.io.cloud.ovh.net
  AWS_REGION:             BHS
  # Slice 56D: master switch. When false, /classify ignores tenant_id
  # and always uses the platform model. Trainer also reads this env to
  # reject `--tenant-id` invocations.
  #
  # Slice 56D follow-up: this is the SAFE DEFAULT. The Makefile bridges
  # CLASSIFIER_PER_TENANT_ENABLED from the operator's shell env (via
  # .envrc) into `helm --set` at deploy time, so flipping in .envrc is
  # the single switch operators actually use. This default only takes
  # effect when a deploy runs without the env set (e.g. CI/CD pipelines).
  CLASSIFIER_PER_TENANT_ENABLED: "false"

envFrom:
  - secretRef:
      name: intent-classifier-credentials

# Slice 56C: in-cluster trainer CronJob.
#   schedule: cron expression (default = weekly Sunday 02:30 UTC)
#   minUntrained: skip retrain if fewer than this many reviewed rows
#                 have arrived since the latest model_run cutoff
#   timeoutSeconds: hard kill ceiling on a single train invocation
#   enabled: master switch (set false to disable cron retrains entirely)
trainer:
  enabled:        true
  schedule:       "30 2 * * 0"
  minUntrained:   "1"
  timeoutSeconds: 600

# Slice 56E: in-cluster Langfuse trace-export import CronJob.
#   Imports clean-success turns from Langfuse → bot_intent_training_data
#   (reviewed=false). Operator approves via `make training-data-review`.
#   Schedule LEADS the trainer by ~24h so reviewed rows are ready in time.
#   schedule: cron expression (default = weekly Saturday 02:00 UTC)
#   days:     trace lookback window
#   limit:    cap on rows imported per run
traceImport:
  enabled:        true
  schedule:       "0 2 * * 6"
  days:           "7"
  limit:          "500"
  timeoutSeconds: 600

livenessProbe:
  httpGet:
    path: /healthz
    port: 8000
  initialDelaySeconds: 10
  periodSeconds:       30
  timeoutSeconds:      3
  failureThreshold:    3

readinessProbe:
  httpGet:
    path: /healthz
    port: 8000
  initialDelaySeconds: 3
  periodSeconds:       10
  timeoutSeconds:      2
  failureThreshold:    3
