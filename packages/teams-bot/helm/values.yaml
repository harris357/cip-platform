# Required K8s Secret: teams-bot-credentials
# Keys (legacy/single-realm dev): BOT_APP_ID, BOT_APP_PASSWORD, KEYCLOAK_CLIENT_SECRET,
#                                 AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY
# Keys (Slice 36 multi-tenant):   PLATFORM_ADMIN_TOKEN — same value as on hr-service
#                                 KEYCLOAK_CLIENT_SECRETS — JSON map of {realm: secret}
#                                   (Slice 37 deprecates this in favour of per-tenant
#                                    K8s secrets named tenant-aad-<tenantId>; kept as
#                                    backwards-compat fallback during migration.)
#
# Slice 37: per-tenant K8s secrets named tenant-aad-<tenantId> hold each
# tenant's KEYCLOAK_CLIENT_SECRET. Provisioning creates them via
# scripts/provision-tenant.sh; the bot reads them via its ServiceAccount
# (created by service-account.yaml when serviceAccount.create=true).

replicaCount: 1

serviceAccount:
  # Slice 37: when true, helm creates a ServiceAccount + Role + RoleBinding
  # giving the bot pod secrets:get on the cip-app namespace. Required for
  # the per-tenant KC client secret reads.
  create: true

image:
  repository: ghcr.io/harris357/teams-bot
  tag: "latest"  # override per-deploy via helm --set image.tag=<sha>
  pullPolicy: Always

service:
  type: ClusterIP
  port: 3978

env:
  MICROSOFT_APP_TENANT_ID: "8ce0ee69-ceac-4dc1-9691-ff463edcebb9"
  BOT_DOMAIN: bot-cip.idlevice.ca
  LITELLM_BASE_URL: http://litellm.cip-app.svc.cluster.local:4000
  NATS_URL: nats://nats.cip-infra.svc.cluster.local:4222
  # Slice 56D follow-up: append /auth path prefix. Service name was
  # already correct here, but Keycloak serves all endpoints under
  # /auth/realms/... — JWT validation has been working via JWK cache;
  # fresh fetches were silently 404'ing.
  KEYCLOAK_URL: http://keycloak-keycloakx-http.cip-auth.svc.cluster.local/auth
  # Slice 36: bot is multi-tenant. KEYCLOAK_REALM is no longer read by the
  # bot — the realm is resolved per-request via tenant lookup. Kept here for
  # reference / migration only.
  KEYCLOAK_REALM: cip-dev
  # Slice 36: per-realm KC client secrets via KEYCLOAK_CLIENT_SECRETS (JSON
  # map in the credentials secret). KEYCLOAK_CLIENT_SECRET (single value)
  # still works as a fallback for the realm named by KEYCLOAK_REALM_FALLBACK.
  KEYCLOAK_REALM_FALLBACK: cip-dev
  # Slice 63: tenant resolver now calls platform-core (was hr-service) with
  # PLATFORM_ADMIN_TOKEN to map activity.channelData.tenant.id (Entra GUID)
  # → CIP tenant + realm. Same path, same response shape.
  PLATFORM_CORE_URL: http://platform-core.cip-app.svc.cluster.local:3001
  # HR_SERVICE_URL still used by other bot calls (sync_employee,
  # get_employee_permissions) until slice 66 moves those too.
  HR_SERVICE_URL: http://hr-service.cip-app.svc.cluster.local:3000
  # new keys — stubs; override at deploy time or via secret
  MCP_SERVER_URL: http://hr-service.cip-app.svc.cluster.local:4001/mcp
  # Slice 58B-2b: bot fans MCP discovery + execution across two servers.
  # MCP_SERVER_URL still points to hr-service for the legacy single-server
  # callers (auth/resolve-context, channel-registry) until those are
  # migrated to the multi-server registry. The two URLs below are the
  # canonical names the new code reads.
  HR_SERVICE_MCP_URL:       http://hr-service.cip-app.svc.cluster.local:4001/mcp
  DOCUMENT_SERVICE_MCP_URL: http://document-service.cip-app.svc.cluster.local:3000/mcp
  # Slice 66: platform-core MCP server hosts sync_user (and grows in slice 69).
  PLATFORM_CORE_MCP_URL:    http://platform-core.cip-app.svc.cluster.local:3001/mcp/platform
  KEYCLOAK_CLIENT_ID: teams-bot
  OBJECT_STORE_BUCKET: cip-uploads     # override at deploy time per environment
  AWS_ENDPOINT_URL: https://s3.bhs.io.cloud.ovh.net
  AWS_REGION: BHS
  CHANNEL_REGISTRY_BUCKET: teams-channel-registry
  # Slice 39B: when 'true', the bot posts a markdown debug banner after every
  # reply showing classifier output, Stage 2 alias, and per-stage timing.
  # Off in production; live-toggleable in dev with:
  #   kubectl set env -n cip-app deploy/teams-bot BOT_DEBUG_CLASSIFICATION=true
  BOT_DEBUG_CLASSIFICATION: "false"
  # Slice 39B: minimal "_⏱ X.Xs_" footer after every reply. On by default;
  # turn off in production with BOT_SHOW_RESPONSE_TIME=false.
  BOT_SHOW_RESPONSE_TIME: "true"
  # Slice 41: which Langfuse prompt label to fetch from. 'production' is
  # the canonical version; promote a draft version via the Langfuse UI to
  # take effect. Override to 'staging' on a single canary pod to A/B-test
  # a new prompt without affecting other tenants.
  LANGFUSE_PROMPT_LABEL: "production"

envFrom:
  - secretRef:
      name: teams-bot-credentials

ingress:
  enabled: true
  # Hostname pattern: bot-${ENV_PREFIX}.${DOMAIN} — update .envrc to change
  host: bot-cip.idlevice.ca   # set as BOT_MESSAGING_ENDPOINT in Azure bot registration
  tls: true
  # MS Bot Framework / AzureBotService source CIDRs. Empty = unrestricted (safe default while
  # populating IPs). Get current list:
  #   jq '[.values[] | select(.name | startswith("AzureBotService")) | .properties.addressPrefixes[]] | .[]' ServiceTags_Public.json
  botWhitelistSourceRange: ""
