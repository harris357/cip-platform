replicaCount: 1

image:
  repository: ghcr.io/idlevice/teams-bot
  tag: dev
  pullPolicy: Always

service:
  type: ClusterIP
  port: 3978

env:
  LITELLM_BASE_URL: http://litellm.cip-app.svc.cluster.local:4000
  NATS_URL: nats://nats.cip-infra.svc.cluster.local:4222
  KEYCLOAK_URL: https://keycloak.dev.cip.io
  KEYCLOAK_REALM: cip-dev

envFrom:
  - secretRef:
      name: teams-bot-credentials

ingress:
  enabled: true
  host: bot.dev.cip.idlevice.ca   # set as BOT_MESSAGING_ENDPOINT in Azure bot registration
  tls: true
