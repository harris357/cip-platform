{{- if .Values.serviceAccount.create -}}
# Slice 37: dedicated ServiceAccount for the bot so it can read per-tenant
# K8s secrets (named tenant-aad-<tenantId>) on cache miss.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Chart.Name }}
  namespace: {{ .Release.Namespace }}
---
# Namespace-scoped Role granting read access to secrets in cip-app.
#
# Trade-off: K8s Role does NOT support glob/regex in resourceNames. To restrict
# to ONLY tenant-aad-* secrets we'd have to maintain an explicit list and
# update it on every tenant onboarding, which couples helm releases to data.
# Default approach: namespace-wide secrets:get with NO resourceNames filter.
# Acceptable because cip-app is a trusted application namespace whose secrets
# are all bot-relevant. Tighten to an explicit list if a future audit requires it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Chart.Name }}-secret-reader
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Chart.Name }}-secret-reader
  namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Chart.Name }}-secret-reader
subjects:
  - kind: ServiceAccount
    name: {{ .Chart.Name }}
    namespace: {{ .Release.Namespace }}
{{- end -}}
