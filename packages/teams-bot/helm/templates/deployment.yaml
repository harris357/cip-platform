apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  namespace: cip-app
  labels:
    app: teams-bot
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: teams-bot
  template:
    metadata:
      labels:
        app: teams-bot
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ .Chart.Name }}
      {{- end }}
      containers:
        - name: teams-bot
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.service.port }}
          env:
            # Slice 37: pod namespace via downward API — k8s-secret-loader
            # uses it to default the namespace for per-tenant secret reads.
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Slice 47: build SHA exposed to the bot for /about reporting.
            # Tracks the deployed image tag (commit SHA from CI).
            - name: BOT_BUILD_SHA
              value: {{ .Values.image.tag | quote }}
            {{- range $key, $val := .Values.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
          {{- with .Values.envFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
