replicaCount: 1

image:
  repository: ghcr.io/harris357/platform-core
  tag: "latest"  # override per-deploy via helm --set image.tag=<sha>
  pullPolicy: Always

service:
  type: ClusterIP
  port: 3001

env:
  LITELLM_BASE_URL: http://litellm.cip-app.svc.cluster.local:4000
  NATS_URL: nats://nats.cip-infra.svc.cluster.local:4222
  TEMPORAL_TASK_QUEUE: cip-platform-tasks
  KEYCLOAK_URL: http://keycloak-keycloakx.cip-auth.svc.cluster.local
  KEYCLOAK_REALM: cip-dev
  # Slice 35: platform-core POST /tenants calls hr-service to insert the
  # canonical tenant row before firing the provisioning workflow.
  HR_SERVICE_URL: http://hr-service.cip-app.svc.cluster.local:3000
  # PLATFORM_ADMIN_TOKEN is sourced from platform-core-credentials secret
  # below; the same value must be set on hr-service.

envFrom:
  - secretRef:
      name: platform-core-credentials

ingress:
  enabled: false
  # Hostname pattern: api-${ENV_PREFIX}.${DOMAIN} — update .envrc to change
  host: api-cip.idlevice.ca
  tls: true
