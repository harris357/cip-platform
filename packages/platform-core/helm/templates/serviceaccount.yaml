{{- if .Values.serviceAccount.create }}
# Slice 71: platform-core needs secrets:create/patch/get on cip-app namespace
# so its Temporal worker pod can run createK8sSecret as part of
# TenantProvisioningWorkflow (replaces bash section 5a).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name | default "platform-core" }}
  namespace: cip-app
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.serviceAccount.name | default "platform-core" }}-secrets
  namespace: cip-app
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs:     ["get", "create", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.serviceAccount.name | default "platform-core" }}-secrets
  namespace: cip-app
subjects:
  - kind: ServiceAccount
    name: {{ .Values.serviceAccount.name | default "platform-core" }}
    namespace: cip-app
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind:     Role
  name:     {{ .Values.serviceAccount.name | default "platform-core" }}-secrets
{{- end }}
