name: Build and Push Images

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
    paths:
      - 'packages/hr-service/**'
      - 'packages/platform-core/**'
      - 'packages/teams-bot/**'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [hr-service, platform-core, teams-bot]
      max-parallel: 2
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        # Authenticate with Docker Hub to avoid anonymous pull rate limits (100/6h per IP).
        # continue-on-error so builds still work if DOCKERHUB_TOKEN isn't set yet.
        continue-on-error: true
        with:
          username: harris357
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/login-action@v3
        # Only log in on master push — PRs use read-only token and skip push
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (PR — verify only, no push)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./packages/${{ matrix.service }}/Dockerfile
          push: false
          tags: ghcr.io/harris357/${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push (master — sha + latest tags)
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./packages/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/harris357/${{ matrix.service }}:${{ github.sha }}
            ghcr.io/harris357/${{ matrix.service }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
