name: Cluster shutdown (nightly)

# Schedules `make stop` from outside the cluster — the cluster can't
# scale its own node pool to 0 without killing the pod making the
# OVH API call mid-flight.
#
# Runs on a cron schedule AND can be triggered manually from the GH
# UI's "Run workflow" button.
#
# Concurrency: shares a group with cluster-startup so a manual startup
# fired right before midnight doesn't get clobbered halfway through.

on:
  schedule:
    # 00:00 UTC nightly = 7pm EST / 4pm PST. Adjust to taste.
    # GH Actions cron can be ~5-15 min late under load — that's fine
    # for shutdown (later = more uptime, no harm).
    - cron: '0 0 * * *'
  workflow_dispatch:
    inputs:
      reason:
        description: 'Why are you running this manually?'
        required: false
        default: 'manual shutdown'

concurrency:
  group: cluster-lifecycle
  cancel-in-progress: false   # Wait for any in-flight startup/shutdown to finish

permissions:
  contents: read   # No commits from this workflow

jobs:
  shutdown:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node + pnpm
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install deps
        run: pnpm install --frozen-lockfile

      - name: Install kubectl + helm
        # GH-hosted ubuntu runners include kubectl, but it can lag the
        # cluster version. Pin to whatever the cluster runs.
        run: |
          curl -sLO "https://dl.k8s.io/release/v1.30.0/bin/linux/amd64/kubectl"
          chmod +x kubectl && sudo mv kubectl /usr/local/bin/
          curl -sL https://get.helm.sh/helm-v3.16.0-linux-amd64.tar.gz | tar xz
          sudo mv linux-amd64/helm /usr/local/bin/

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_B64 }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Write .envrc
        # The full .envrc content lives in one secret; write it to disk
        # so `make stop` and the underlying scripts can `source .envrc`
        # exactly the way they do on the operator's workstation.
        run: |
          echo "${{ secrets.ENVRC_B64 }}" | base64 -d > .envrc

      - name: make stop
        run: |
          set -a
          source .envrc
          set +a
          make stop

      - name: Cleanup
        if: always()
        run: rm -f .envrc ~/.kube/config
