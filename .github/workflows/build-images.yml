name: Build App Images

on:
  push:
    branches: [master]
    paths:
      - 'packages/hr-service/**'
      - 'packages/platform-core/**'
      - 'packages/teams-bot/**'

jobs:
  build-hr-service:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./packages/hr-service
          push: true
          tags: |
            ghcr.io/idlevice/hr-service:dev
            ghcr.io/idlevice/hr-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-platform-core:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./packages/platform-core
          push: true
          tags: |
            ghcr.io/idlevice/platform-core:dev
            ghcr.io/idlevice/platform-core:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-teams-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./packages/teams-bot
          push: true
          tags: |
            ghcr.io/idlevice/teams-bot:dev
            ghcr.io/idlevice/teams-bot:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
